name: carbium
description: "A lightweight EPUB reader app like Lithium."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  file_picker: ^8.0.0
  path_provider: ^2.1.0
  epubx: ^3.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.4.0
  flutter_html: ^3.0.0-beta.2
  provider: ^6.0.0
  google_fonts: ^6.1.0
  scrollable_positioned_list: ^0.3.8
  sqflite: ^2.3.0
  path: ^1.8.3
  crypto: ^3.0.3
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
